name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  fmt:
    name: format
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft == false
    env:
      GOTOOLCHAIN: local
      GOPRIVATE: github.com/joakimcarlsson/*
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # pkg/proto comes from the private wasa-api repo, which the job's own
      # GITHUB_TOKEN cannot read. WASA_API_TOKEN is a PAT with read access to it.
      - name: Authenticate the private wasa-api module
        env:
          WASA_API_TOKEN: ${{ secrets.WASA_API_TOKEN }}
        run: |
          git config --global \
            url."https://x-access-token:${WASA_API_TOKEN}@github.com/joakimcarlsson/".insteadOf \
            "https://github.com/joakimcarlsson/"

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Check goimports
        run: |
          go install golang.org/x/tools/cmd/goimports@latest
          output=$(goimports -l .)
          if [ -n "$output" ]; then
            echo "Files not formatted:"
            echo "$output"
            exit 1
          fi

  build:
    name: build & test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    if: github.event.pull_request.draft == false
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
    env:
      GOTOOLCHAIN: local
      GOPRIVATE: github.com/joakimcarlsson/*
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Authenticate the private wasa-api module
        env:
          WASA_API_TOKEN: ${{ secrets.WASA_API_TOKEN }}
        run: |
          git config --global \
            url."https://x-access-token:${WASA_API_TOKEN}@github.com/joakimcarlsson/".insteadOf \
            "https://github.com/joakimcarlsson/"

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2
