name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  goreleaser:
    name: Release
    runs-on: ubuntu-latest
    env:
      GOTOOLCHAIN: local
      GOPRIVATE: github.com/joakimcarlsson/*
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # pkg/proto comes from the private wasa-api repo, which the job's own
      # GITHUB_TOKEN cannot read. WASA_API_TOKEN is a PAT with read access to it.
      - name: Authenticate the private wasa-api module
        env:
          WASA_API_TOKEN: ${{ secrets.WASA_API_TOKEN }}
        run: |
          git config --global \
            url."https://x-access-token:${WASA_API_TOKEN}@github.com/joakimcarlsson/".insteadOf \
            "https://github.com/joakimcarlsson/"

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
